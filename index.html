<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Cadastro de Séries</title>
</head>
<body>
    <h1>Cadastro de Séries</h1>

    <form id="formAluno">

        <input type="text" id="temporada" placeholder="Temporada">
        <button id="btnSalvar" type="submit">Episódio</button>
    </form>

    <br><br><!--NÃO USAR-->

    <table>
        <thead>
            <th>Posição</th>
            <th>Nome da Série</th>
            <th>Temporada</th>
        </thead>

        <tbody id="corpoTabela"></tbody>
    </table>

    <script src="main.js"></script>
</body>
</html>
